[workspace]
resolver = "2"
exclude = ["crates/cb-web"]
members = [
  "crates/cb-types",
  "crates/cb-crypto",
  "crates/cb-schema",
  "crates/cb-trie",
  "crates/cb-state",
  "crates/cb-tx",
  "crates/cb-engine",
  "crates/cb-block",
  "crates/cb-consensus",
  "crates/cb-genesis",
  "crates/cb-rpc",
  "crates/cb-net",
  "crates/cb-node",
  "crates/cb-cli",
  "crates/cb-client",
  "crates/cb-dashboard",
  "crates/cb-sim",
  "crates/cb-ports",
  "crates/cb-store-sqlite",
  "crates/cb-bus",
  "crates/cb-feed",
  "crates/cb-gateway",
  "crates/cb-simgame",
  "crates/cb-oracle",
  "crates/cb-e2e",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
tiny-keccak = { version = "2", features = ["keccak"] }
sha2 = "0.10"
rustc-hash = "2"
secp256k1 = { version = "0.29", features = ["recovery", "rand"] }
rand = "0.8"
rayon = "1.10.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
futures = "0.3"
capnp = "0.20"
capnpc = "0.20"
capnp-rpc = "0.20"
capnp-futures = "0.20"
rocksdb = "0.22"
bytes = "1"
proptest = "1.4.0"
tempfile = "3.14.0"
clap = { version = "4.5.38", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.7.5"
tower = "0.4"

# ---- added for the exchange/simulator layer ----
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand_chacha = "0.3"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-gzip"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
headers = "0.4"
dashmap = "6"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_with = "3"
