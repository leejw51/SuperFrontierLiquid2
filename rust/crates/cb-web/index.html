<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>SuperFrontierLiquid</title>
    <link rel="icon" href="/assets/coin_btc.png" type="image/png" />
    <meta
      name="description"
      content="A personal experiment in exchange and blockchain design. A local Rust prototype for spot, perpetual and dated-futures trading with simulated funds."
    />
    <!-- Tokens first, then the lifted design-system CSS, then shell mechanics.
         Trunk fingerprints each file, so these are separate links rather than
         @import: a hashed filename breaks a relative import. -->
    <link data-trunk rel="css" href="styles/tokens.css" />
    <link data-trunk rel="css" href="styles/app.css" />
    <link data-trunk rel="css" href="styles/shell.css" />
    <!-- The 16-bit skin: SNES and Genesis, pixel fonts, bevelled panels and a
         CRT scanline over the lot. It is layered LAST so the lifted design
         system underneath keeps its structure and the skin only changes how
         that structure is painted. -->
    <link data-trunk rel="css" href="styles/retro.css" />
    <!-- Pixel fonts (OFL) and the Grok-generated sprites, copied as-is. -->
    <link data-trunk rel="copy-dir" href="fonts" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>
  <body>
    <!-- The icon sprite, lifted from docs/design/reference.html. The lifted
         markup refers to these by `<use href="#i-...">`, so they have to exist
         in the document before anything renders. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <symbol id="i-check" viewBox="0 0 12 12"><path d="M1.5 6.2 4.4 9 10.5 2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 12 12"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-warn" viewBox="0 0 14 14"><path d="M7 1.6 13 12.4H1L7 1.6Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 5.6v3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="10.7" r=".85" fill="currentColor"/></symbol>
      <symbol id="i-info" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 6.2v3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="7" cy="4.2" r=".85" fill="currentColor"/></symbol>
      <symbol id="i-clock" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 3.6V7l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 14 14"><rect x="4.6" y="4.6" width="7.6" height="7.6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 4.6V3.2a1.4 1.4 0 0 0-1.4-1.4H3.2a1.4 1.4 0 0 0-1.4 1.4V8a1.4 1.4 0 0 0 1.4 1.4h1.4" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-book" viewBox="0 0 14 14"><rect x="1.4" y="2" width="11.2" height="2.6" rx=".6" fill="currentColor" opacity=".55"/><rect x="1.4" y="5.8" width="7.4" height="2.4" rx=".6" fill="currentColor" opacity=".35"/><rect x="1.4" y="9.4" width="11.2" height="2.6" rx=".6" fill="currentColor"/></symbol>
      <symbol id="i-chain" viewBox="0 0 14 14"><rect x="1.2" y="4.2" width="5.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="7.6" y="4.2" width="5.2" height="5.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
      <symbol id="i-empty" viewBox="0 0 28 28"><rect x="2.5" y="6.5" width="23" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 12h23M9.5 12v9.5" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".6"/></symbol>
      <symbol id="i-key" viewBox="0 0 14 14"><circle cx="4.4" cy="4.4" r="2.9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.5 6.5 12 12M9.6 9.6l-1.5 1.5M11 11l-1.3 1.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-vault" viewBox="0 0 14 14"><rect x="1.4" y="2.2" width="11.2" height="9.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 3.2v1.4M7 9.4v1.4M3.2 7h1.4M9.4 7h1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 12"><path d="M0 6h20M15.4 1.6 20 6l-4.6 4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-eyeoff" viewBox="0 0 28 28"><path d="M4 14s4-6.5 10-6.5c1.5 0 2.9.4 4.1 1M24 14s-4 6.5-10 6.5c-1.6 0-3-.4-4.2-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="14" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 5l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 14 14"><circle cx="6.2" cy="6.2" r="4.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 9.4 12.4 12.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-plug" viewBox="0 0 28 28"><path d="M11 3.5v7M17 3.5v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7.5 10.5h13v3.5a6.5 6.5 0 0 1-13 0v-3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 20.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    </svg>
    <div id="cb-root"></div>
  </body>
</html>
