[package]
name = "cb-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cb-gateway"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
axum = { workspace = true, features = ["ws", "macros"] }
axum-extra = { workspace = true }
headers = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["signal", "process"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
clap = { workspace = true, features = ["env"] }
sqlx = { workspace = true }
cb-ports = { path = "../cb-ports" }
cb-store-sqlite = { path = "../cb-store-sqlite" }
cb-bus = { path = "../cb-bus" }
cb-feed = { path = "../cb-feed" }
cb-types = { path = "../cb-types" }
cb-crypto = { path = "../cb-crypto" }
tokio-tungstenite = "0.21"
futures-util = "0.3"
cb-tx = { path = "../cb-tx" }
cb-rpc = { path = "../cb-rpc" }
cb-schema = { path = "../cb-schema" }
cb-engine = { path = "../cb-engine" }
cb-block = { path = "../cb-block" }
bip32 = "0.5"
bip39 = "2"
secp256k1 = { workspace = true }
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
chacha20poly1305 = "0.10"
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
cb-crypto = { path = "../cb-crypto" }
tokio-tungstenite = "0.21"
futures-util = "0.3"
