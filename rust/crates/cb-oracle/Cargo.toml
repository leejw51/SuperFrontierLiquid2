[package]
name = "cb-oracle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cb-oracle"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
# `env` so the authority key can arrive as ORACLE_AUTHORITY_KEY rather than on
# a command line that every `ps` on the box can read.
clap = { workspace = true, features = ["env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rust_decimal = { workspace = true }
hex = { workspace = true }
secp256k1 = { workspace = true }
axum = { workspace = true }
capnp = { workspace = true }
capnp-rpc = { workspace = true }
cb-crypto = { path = "../cb-crypto" }
cb-feed = { path = "../cb-feed" }
cb-ports = { path = "../cb-ports" }
cb-rpc = { path = "../cb-rpc" }
cb-schema = { path = "../cb-schema" }
cb-tx = { path = "../cb-tx" }
cb-types = { path = "../cb-types" }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
