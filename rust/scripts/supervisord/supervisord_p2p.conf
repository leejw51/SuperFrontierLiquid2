; Supervisord configuration for a 3-node SuperFrontierLiquid cluster running
; peer-to-peer sync instead of the leader-star.
;
; What is different from `supervisord.conf`:
;
;   * node1 and node2 do not name a sequencer. They have no `--sequencer`
;     flag at all; they find the chain through the peer-to-peer layer.
;   * node2's only seed is node1, not the leader. It reaches the chain through
;     a peer, which is the property the star topology could not provide.
;   * Every block a replica adopts here has been re-executed and its state
;     root recomputed. There is no fast-mirror mode on the gossip path, so
;     `--strict-sync` is neither needed nor accepted: verification is the only
;     behaviour.
;   * node1 exposes `--rpc-listen`, so an order can be submitted to a node
;     that is not the sequencer and reach the block producer by transaction
;     gossip.
;
; KNOWN GAP — READ THIS BEFORE USING THIS CONFIG FOR ANYTHING BUT SYNC TESTING:
;
;   This cluster produces NO QUORUM CERTIFICATES. Consensus votes still travel
;   to the leader over its RPC, and a peer-to-peer replica holds no such
;   connection, so node1 and node2 never vote. Quorum is 2-of-3 and the
;   leader's self-vote is 1 of them, so `last_qc_height` stays at 0 forever.
;   Blocks are produced, propagated, re-executed and verified, and all three
;   nodes agree on the state root — but nothing here is *final*.
;
;   `supervisord.conf` (the legacy star) is still the configuration to use when
;   finality matters. Carrying votes and quorum certificates over gossip is
;   consensus work rather than sync work and was deliberately left out of the
;   peer-to-peer change; until it lands, treat this file as a sync harness.
;
; Scoring and banning thresholds come from `p2p.toml` in this directory rather
; than from the command line, so an operator can retune them without touching
; process arguments.
;
; All paths are relative to this file.

[unix_http_server]
file = /tmp/cb-supervisord.sock
chmod = 0700

[supervisord]
logfile = ./logs/supervisord.log
pidfile = ./logs/supervisord.pid
nodaemon = false
loglevel = info
childlogdir = ./logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/cb-supervisord.sock

[program:node0]
; Sequencer (validators[0]). Still the only block producer — peer-to-peer
; changes how blocks travel, not who makes them. It gossips each new head as
; it is produced and accepts gossiped transactions into its mempool.
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node0
    sequencer
        --listen 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18080
        --block-interval-ms 50
        --max-block-txs 50000
        --dev-key-seed cb-validator-0
        --p2p-listen 127.0.0.1:7800
        --p2p-config ./p2p.toml
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node0.out.log
stderr_logfile = ./logs/node0.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node1]
; Replica (validators[1]) on gossip. Seeded from the sequencer, and accepting
; client transactions of its own on 7701 — those are gossiped onward rather
; than dropped into a mempool nobody drains.
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node1
    replica
        --dashboard-listen 127.0.0.1:18081
        --dev-key-seed cb-validator-1
        --rpc-listen 127.0.0.1:7701
        --p2p-listen 127.0.0.1:7801
        --p2p-seed 127.0.0.1:7800
        --p2p-config ./p2p.toml
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node1.out.log
stderr_logfile = ./logs/node1.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node2]
; Replica (validators[2]) seeded ONLY from node1. It never learns the
; sequencer's address from configuration — it discovers it through peer
; exchange, and it can sync from node1 whether or not it ever reaches the
; leader. That is the whole point of the change.
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node2
    replica
        --dashboard-listen 127.0.0.1:18082
        --dev-key-seed cb-validator-2
        --p2p-listen 127.0.0.1:7802
        --p2p-seed 127.0.0.1:7801
        --p2p-config ./p2p.toml
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node2.out.log
stderr_logfile = ./logs/node2.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB
