; Supervisord configuration for the multi-node benchmark cluster.
;
; 3-node fast-mirror topology: node0 is the leader running with `--benchmark`
; (an in-process tx generator that bypasses the mempool + ECDSA-recovery
; pipeline by feeding pre-verified VerifiedTx objects directly through a
; bounded channel). node1 and node2 are fast-mirror replicas — they persist
; raw block bytes via a single WriteBatch per block (no re-execution, no
; state_root recompute) and fire votes async. With the leader's self-vote
; plus either replica's vote that's a 2-of-3 quorum every block.
;
; Used by `make startmultibenchmark`.

[unix_http_server]
file = /tmp/cb-supervisord.sock
chmod = 0700

[supervisord]
logfile = ./logs/supervisord.log
pidfile = ./logs/supervisord.pid
nodaemon = false
loglevel = info
childlogdir = ./logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/cb-supervisord.sock

[program:node0]
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node0
    sequencer
        --listen 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18080
        --block-interval-ms 50
        --max-block-txs 50000
        --dev-key-seed cb-validator-0
        --benchmark
        --bench-traders 32
        --bench-workers 0
        --bench-channel-capacity 100000
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node0.out.log
stderr_logfile = ./logs/node0.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node1]
; Fast-mirror replica (validators[1]). No --listen → no RPC ingress; tx
; ingress is leader-only by construction. Stores raw block bytes via a
; single WriteBatch per block; votes async.
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node1
    replica
        --sequencer 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18081
        --dev-key-seed cb-validator-1
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node1.out.log
stderr_logfile = ./logs/node1.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node2]
; Fast-mirror replica (validators[2]). Same invariant as node1 — no RPC
; ingress, raw-bytes mirror, async vote.
environment = RUST_LOG=info
command = ../../target/release/cb-node
    --data-dir ./data/node2
    replica
        --sequencer 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18082
        --dev-key-seed cb-validator-2
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node2.out.log
stderr_logfile = ./logs/node2.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB
