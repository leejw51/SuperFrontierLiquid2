; Supervisord configuration for a 3-node SuperFrontierLiquid cluster.
;
; Today: 1 sequencer (node0, validators[0]) + 2 replicas (node1, node2). Each node
; runs in its own data dir and exposes an HTTP dashboard so verify.py can poll
; (head_height, state_root) from all three.
;
; All paths are relative to this file. Run via `python3 run.py` from this directory.

[unix_http_server]
file = /tmp/cb-supervisord.sock
chmod = 0700

[supervisord]
logfile = ./logs/supervisord.log
pidfile = ./logs/supervisord.pid
nodaemon = false
loglevel = info
childlogdir = ./logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/cb-supervisord.sock

[program:node0]
; Sequencer (validators[0]). Signs blocks with the dev key derived from
; "cb-validator-0" (matches the genesis seed). RPC listens on 7700, dashboard
; on 18080.
command = ../../target/release/cb-node
    --data-dir ./data/node0
    sequencer
        --listen 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18080
        --block-interval-ms 50
        --max-block-txs 50000
        --dev-key-seed cb-validator-0
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node0.out.log
stderr_logfile = ./logs/node0.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node1]
; Replica (validators[1]). It listens on its own RPC port but nothing submits
; there while node0 leads: a standby that only starts listening after it is
; promoted is a standby nothing can reach at the moment it matters. Clients
; submit to whoever leads.
;
; --strict-sync is required for the integration test: it cross-checks per-
; trader balances on each replica's dashboard, which only match the leader
; when the replica re-executes blocks. The default fast-mirror mode persists
; raw block bytes + claimed state_root but never updates the accounts CF.
;
; Failover. When node0 stops, the validator that leads the next view becomes
; the sequencer in this same process, on this same database, and the other
; follower finds it through --peer. So:
;   --failover-after-ms  how long without a block before asking whether the
;                        leader is still there (it is asked, not assumed).
;   --listen             where this node accepts transactions once it leads.
;                        Without it a standby can lead but nothing can reach it.
;   --peer               the other validators' RPC addresses. The validator set
;                        records identities, not endpoints.
; A fast-mirror replica cannot do any of this: it keeps no state to lead from.
command = ../../target/release/cb-node
    --data-dir ./data/node1
    replica
        --sequencer 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18081
        --dev-key-seed cb-validator-1
        --strict-sync
        --failover-after-ms 5000
        --listen 127.0.0.1:7701
        --peer 127.0.0.1:7702
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node1.out.log
stderr_logfile = ./logs/node1.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB

[program:node2]
; Replica (validators[2]). Same shape as node1: listens on its own port,
; follows node0, and is next in line after node1. Strict-sync for the same
; reason — the integration test reads per-trader balances.
command = ../../target/release/cb-node
    --data-dir ./data/node2
    replica
        --sequencer 127.0.0.1:7700
        --dashboard-listen 127.0.0.1:18082
        --dev-key-seed cb-validator-2
        --strict-sync
        --failover-after-ms 5000
        --listen 127.0.0.1:7702
        --peer 127.0.0.1:7701
directory = %(here)s
autostart = true
autorestart = false
stopasgroup = true
killasgroup = true
stdout_logfile = ./logs/node2.out.log
stderr_logfile = ./logs/node2.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB
